[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lead-routing-context-demo"
version = "0.1.0"
description = "Reliable AI lead routing: dbt context, deterministic policy, a workflow ledger and read-only MCP tools"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "dbt-core>=1.10,<2",
    "dbt-duckdb>=1.10,<2",
    "duckdb>=1.2",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lead-routing = "lead_routing.cli:main"
lead-routing-mcp = "lead_routing.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
